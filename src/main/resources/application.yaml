spring:
  application:
    name: MVCbegines2WithValidation
app:
  task:
    # Если true, включается строгая проверка (будет использоваться strictPolicy)
    # Если false или настройки нет вообще, включится мягкая проверка (lenientPolicy)
    strict-mode: true

    # Минимальная длина заголовка для строгого режима.
    # TaskAppProperties проверит, что это число от 3 до 20 (благодаря @Min и @Max)
    min-title-length: 5